      type: object
    HandlersAsaTitleDescriptionPair:
      properties:
        description:
          type: string
        title:
          type: string
      type: object
    Mdm_serviceDomain:
      description: Domain parsed from X-Authenticated-Domain or X-Authenticated-Sender headers, which represents the domain used for sender authentication, typically the domain of the sending organization. This field provides additional context for analyzing the legitimacy of the sender
      properties:
        domain:
          description: The fully qualified domain name (FQDN). This may not *always* be routable, e.g. when an email address contains a domain that is just a TLD with no SLD, e.g. foo@WIN-bar
          format: hostname
          type: string
        punycode:
          description: Interpreted punycode if the domain starts with xn--. For example, if 'domain' is 'xn--ublimesecurity-4xc.com' then 'punycode' is śublimesecurity.com
          type: string
        root_domain:
          description: The root domain, including the TLD
          format: hostname
          type: string
        sld:
          description: Second-level domain, e.g. 'windows' for the domain 'windows.net'
          type: string
        subdomain:
          description: Subdomain, e.g. 'drive' for the domain 'drive.google.com'
          type: string
        tld:
          description: The domain's top-level domain. E.g. the TLD of google.com is 'com'
          type: string
        valid:
          description: Whether the domain is valid
          type: boolean
      required:
      - domain
      type: object
    Mdm_serviceExternal:
      description: Cloud API provider or other external source metadata
      properties:
        created_at:
          description: The created time of the message as provided by the cloud API (G Suite or Office 365) or other external source. This is typically the time the external source received the message
          format: date-time
          nullable: true
          type: string
        message_id:
          description: The message ID as provided by the cloud API (G Suite or Office 365) or other external source
          type: string
        route_type:
          description: whether the message was sent or received
          enum:
          - sent
          - received
          type: string
        spam:
          description: The upstream mail gateway determined the message to be spam. For cloud API providers, this will be the same as spam_folder. For other implementation methods like transport rules, this will be determined by message header values (e.g. X-SPAM) if supported
          nullable: true
          type: boolean
        spam_folder:
          description: The message arrived in the user's spam folder. This only applies to cloud APIs (G Suite or Office 365)
          nullable: true
          type: boolean
        thread_id:
          description: The thread/conversation's unique ID as provided by the cloud API (G Suite or Office 365)
          type: string
      type: object
    AnalyzeMessageInput:
      properties:
        queries:
          description: Queries to analyze
          items:
            $ref: '#/components/schemas/Handler_typesQuerySimple'
          type: array
        raw_message:
          description: The full base64 encoded raw eml message
          format: byte
          type: string
        rules:
          description: Rules to analyze
          items:
            $ref: '#/components/schemas/Handler_typesRuleSimple'
          type: array
        run_active_detection_rules:
          default: false
          description: Whether to analyze the message with all active detection rules in your organization
          type: boolean
        run_all_detection_rules:
          default: false
          description: Whether to analyze with all detection rules from all Feeds, including uninstalled + inactive Feed rules, as well as any active detection rules you’ve created that are not part of a Feed.
          type: boolean
        run_all_insights:
          default: false
          description: Whether to analyze with all insights
          type: boolean
      required:
      - raw_message
      type: object
    Actions_typesActionEventCounts:
      properties:
        action_type:
          description: The type of the action that was applied
          type: string
        attempts:
          description: The number of attempts made to apply the action
          format: int32
          type: integer
        change:
          description: The type of change that was made (either applied or reverted)
          type: string
        created_at:
          description: The time the action event was created
          format: date-time
          type: string
        id:
          description: The ID of the action event
          type: string
        total:
          description: The total number of messages that the action was applied to
          format: int32
          type: integer
      type: object
    Handler_typesAnalyzeResponseRule:
      properties:
        error:
          description: Error message, if success == false
          nullable: true
          type: string
        execution_time:
          description: Execution time in seconds
          format: double
          nullable: true
          type: number
        external_errors:
          description: External errors that occurred during evaluation
          items:
            type: string
          type: array
        matched:
          description: Whether the rule matched the provided message
          nullable: true
          type: boolean
        rule:
          $ref: '#/components/schemas/Handler_typesRuleSimplePublicID'
        success:
          description: Whether execution was successful or errored
          type: boolean
      required:
      - execution_time
      - matched
      - success
      type: object
    Mdm_serviceAuthSummary:
      description: Summary of authentication results for the message
      properties:
        dmarc:
          $ref: '#/components/schemas/Mdm_serviceDMARCSummary'
        spf:
          $ref: '#/components/schemas/Mdm_serviceSPFSummary'
      type: object
    TypesMessageType:
      description: The types of the message
      properties:
        inbound:
          description: Message was sent from someone outside your organization, to *at least one* recipient inside your organization
          type: boolean
        internal:
          description: Message was sent between two or more participants inside your organization
          type: boolean
        outbound:
          description: Message was sent from someone inside your organization, to *at least one* recipient outside your organization
          type: boolean
      type: object
    ActionMessageInput:
      properties:
        action:
          description: Action to take on the message group
          enum:
          - restore
          - warning_banner
          - quarantine
          - trash
          - move_to_spam
          - move_to_graymail
          - delete_calendar_events
          type: string
        custom_action_ids:
          description: IDs of actions to perform on the message group
          items:
            type: string
          type: array
        share_with_sublime:
          description: Whether to share the message group & review with Sublime
          type: boolean
      type: object
    Handler_typesAttachmentImageContent:
      properties:
        data:
          description: Base64 encoded PNGs of the raw attachment. Multiple if it is a document with pages.
          items:
            items:
              format: int32
              type: integer
            type: array
          type: array
        hash:
          description: The MD5 hash of the full attachment
          type: string
      type: object
    Handler_typesRuleSimplePublicID:
      description: Metadata for the rule compared against the message
      properties:
        id:
          description: Rule ID
          nullable: true
          type: string
        name:
          description: Rule name
          nullable: true
          type: string
        severity:
          description: Severity associated with the rule
          nullable: true
