            type: string
          type: array
        false_positives:
          description: Descriptions of known false positives that could occur
          items:
            type: string
          type: array
        internal_type:
          description: For core feed only
          nullable: true
          type: string
        label:
          description: Rule label
          nullable: true
          type: string
        maturity:
          description: Rule maturity
          nullable: true
          type: string
        name:
          description: Rule name
          type: string
        references:
