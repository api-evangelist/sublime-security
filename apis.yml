aid: sublime-security
name: Sublime Security
description: >-
  Sublime Security is an adaptive, programmable email security platform that combines
  best-in-class detection effectiveness with deep visibility and control. Teams write
  detection-as-code in Sublime's Message Query Language (MQL) to stop business email
  compromise (BEC), credential phishing, malware, and other email attacks, and can hunt
  retroactively across historical messages. Sublime runs as a managed multi-region cloud
  service or self-managed on Docker, AWS, or Azure, integrates with Microsoft 365, Google
  Workspace, and IMAP, and exposes a REST Platform API (v0), outbound webhooks, SCIM 2.0
  provisioning, a Multi-Tenancy API for MSPs, and a free Analysis API with an open rules
  community. Backed by Index Ventures and IVP.
